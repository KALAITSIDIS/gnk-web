name: CI

on:
  push:
  pull_request:

# ONE RUN PER COMMIT. `push:` is unfiltered on purpose: a branch push is this
# repo's free CI rehearsal, and `main` runs after every merge. `pull_request:`
# stays for the one case a push here cannot cover — a PR from a FORK, whose
# push runs in the fork's Actions, not ours. A PR whose head branch lives in
# THIS repository already ran on its push, so the job below skips the
# pull_request run with that `if:`.
#
# Measured 2026-09-18: every PR commit here ran the workflow twice (6d8ad90,
# 1022720, 69f7bed, bb4ed25, d8efe3c each carry a push run AND a pull_request
# run on the same SHA). A concurrency group is not a fix: it cancels or
# queues, never dedupes, and does nothing when the PR is opened after the push
# run has already finished — the normal order here.
#
# This mirrors gnk-crm's workflow, where the same shape was adopted on
# 2026-09-14 (its DECISIONS.md, T-ci-one-run-per-commit). Keep the two the
# same; if a second job is ever added here, it needs the identical `if:`.

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Production dependencies only, high and above (the CRM's audit
      # response of 2026-09-06, Now #8). A red step here is answered with
      # a plain `npm audit fix`, never `--force`.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # lib/format.test.ts pins the functions that decide whether a fact
      # reaches a buyer. It matters most for the one case nobody can check by
      # looking: no development has ever been published, so how a container
      # renders is proven here or not at all - and the CRM's quality gate scores
      # such a record 100/100, because it measures whether fields are filled
      # rather than whether they are true.
      - name: Test
        run: npm run test

      # Deliberately NO env and NO secrets. The build calls the CRM's PUBLIC
      # feed through generateStaticParams, and getListings returns { ok: false }
      # on any transport failure, so with no network it simply prebuilds no
      # listing pages and exits 0 - they render on demand instead. If this step
      # ever needs a credential, something has started reaching for one at build
      # time and THAT is the thing to investigate: this site holds no secrets by
      # design.
      - name: Build
        run: npm run build
